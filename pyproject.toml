[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ry-ci-templates"
version = "0.1.0"
description = "Shared CI and agent templates"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ross Yeager" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ty type checker (used by lint/lint_full). Mypy config kept in src/mypy_config.ini for mypy target.
[tool.ty.environment]
python-version = "3.12"
extra-paths = ["src", "build", "data_types", "database"]

[tool.ty.src]
exclude = ["**/*_pb2.py"]

[tool.ty.analysis]
allowed-unresolved-imports = [
]

